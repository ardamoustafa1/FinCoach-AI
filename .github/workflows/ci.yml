name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install server dependencies
      run: cd server && npm ci
      
    - name: Run lint
      run: npm run lint
      
    - name: Run typecheck
      run: npm run typecheck
      
    - name: Build
      run: npm run build
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run e2e tests
      run: npm run test:e2e
      
    - name: NPM Audit Root
      run: npm audit
      
    # WhatsApp botu (whatsapp-web.js → Puppeteer) isteğe bağlı bağımlılıktır ve
    # yalnızca WHATSAPP_ENABLED=true iken tembel yüklenir. Puppeteer zincirindeki
    # extract-zip açığının üstte yayımlanmış bir düzeltmesi yok; bu yüzden
    # denetim zorunlu üretim bağımlılıkları üzerinde çalıştırılır.
    - name: NPM Audit Server
      run: cd server && npm audit --omit=optional
      
    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli
        lhci autorun
